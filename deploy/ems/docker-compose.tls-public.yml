# Optional overlay when THIS SERVER owns ports 80/443 (no host nginx on those ports).
# Usage: docker compose -f docker-compose.yml -f docker-compose.tls-public.yml up -d
# Then run scripts/obtain-cert.sh once, then: docker compose restart nginx

services:
  nginx:
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - letsencrypt:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro

  certbot:
    image: certbot/certbot:v2.11.0
    restart: unless-stopped
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: /bin/sh
    command:
      - -c
      - "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet || true; sleep 12h & wait $$!; done"
    depends_on:
      - nginx

volumes:
  letsencrypt:
  certbot-www:
