# Install on the VPS (host nginx already on :80/:443):
#   sudo cp host-nginx-emsmobile.icloud-solutions.net.conf /etc/nginx/sites-available/emsmobile.icloud-solutions.net
#   sudo ln -sf /etc/nginx/sites-available/emsmobile.icloud-solutions.net /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Ensure Docker EMS nginx maps host 18080 -> container 80 (EMS_PUBLISH_HTTP=18080), then TLS:
#   sudo certbot --nginx -d emsmobile.icloud-solutions.net --non-interactive --agree-tos -m YOUR_EMAIL --redirect
#
# Certbot will add ssl_certificate directives and a :443 server block (or extend this file).

upstream ems_mobile_stack {
    server 127.0.0.1:18080;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name emsmobile.icloud-solutions.net;

    access_log /var/log/nginx/emsmobile.access.log;
    error_log  /var/log/nginx/emsmobile.error.log;

    location / {
        proxy_pass http://ems_mobile_stack;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "";
        client_max_body_size 50m;
    }
}
